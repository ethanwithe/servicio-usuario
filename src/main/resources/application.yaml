spring:
  application:
    name: servicio-usuario
    
  datasource:
    url: jdbc:mysql://ballast.proxy.rlwy.net:18056/railway?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
