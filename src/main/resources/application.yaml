server:
  port: ${PORT:8081}
  servlet:
    context-path: /

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server.railway.internal:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: servicio-usuario.railway.internal
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
